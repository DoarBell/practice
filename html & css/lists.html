<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Lists</title>
    </head>
    <body>
        An Unoredered list:
        <ul>
            <li>apple</li>
            <li>banana</li>
            <li>cucumber</li>
            <li>pear</li>
        </ul>
        An Ordered List:
        <ol>
            <li>apple</li>
            <li>banana</li>
            <li>cucumber</li>
            <li>pear</li>
        </ol>
    </body>
</html>
