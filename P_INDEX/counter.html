<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Counter</title>
        <script src="counter.js"></script>
        <link rel="stylesheet" href="css/bootstrap.min.css">
    </head>
    <body>
        <h1 id="number">0</h1>
        <!-- Call the js function -->
        <button id="count">Count</button>
        <button id="reset">Reset</button>

        <h2 id="calculator">Calculator</h2>
        <div class="col" style="max-width: 400px; min-width: 200px;">
            <form id="calc" style="width: 100%;">
                <input autofocus id="formula" oninput="calc(this)" style="width: 100%; height: 40px; font-size: 30px;" type="text">
                <button id="calculate">=</button>
            </form>
        </div>
        <h2 id="result"></h2>
    </body>
</html>
