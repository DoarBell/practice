<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Counter</title>
        <script src="counter.js"></script>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="number">0</h1>
        <!-- Call the js function -->
        <button id="count">Count</button>
        <button id="reset">Reset</button>

        <h2 style="margin-left: 20px;" id="calculator">Calculator</h2>
        <div class="col" style="max-width: 400px; min-width: 100px;">
            <form id="calc">
                <input autofocus id="formula" oninput="calc(this)" style="text-align: right; width: 280px; margin-left: 20px; height: 50px; font-size: 25px;" type="text">
                <div class="container-fluid" style="margin-left: 20px;">
                    <div class="row">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-primary calc">AC</button>
                            <button type="button" class="btn btn-primary calc">(</button>
                            <button type="button" class="btn btn-primary calc">)</button>
                            <button type="button" class="btn btn-primary calc">%</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-primary calc">1</button>
                            <button type="button" class="btn btn-primary calc">2</button>
                            <button type="button" class="btn btn-primary calc">3</button>
                            <button type="button" class="btn btn-primary calc">+</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-primary calc">4</button>
                            <button type="button" class="btn btn-primary calc">5</button>
                            <button type="button" class="btn btn-primary calc">6</button>
                            <button type="button" class="btn btn-primary calc">-</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-primary calc">7</button>
                            <button type="button" class="btn btn-primary calc">8</button>
                            <button type="button" class="btn btn-primary calc">9</button>
                            <button type="button" class="btn btn-primary calc">x</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-primary calc">0</button>
                            <button type="button" class="btn btn-primary calc">.</button>
                            <button id="calculate" type="button" class="btn btn-primary calc">=</button>
                            <button type="button" class="btn btn-primary calc">/</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </body>
</html>
