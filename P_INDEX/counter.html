<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Counter</title>
        <script>
            //initiate a new variable
            let counter = 0;
            //make a new function
            function count() {
                counter++;
                document.querySelector('h1').innerHTML = counter;
            }
        </script>
    </head>
    <body>
        <h1>0</h1>
        <!-- Call the js function -->
        <button onclick="count()">Count</button>
    </body>
</html>
